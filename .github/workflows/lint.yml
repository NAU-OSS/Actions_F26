name: Lint

# A second check on the same pull request, so students see that not every
# check is a test. This is the "It is not only tests" slide, made real.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8
      - run: flake8 . --max-line-length=100
